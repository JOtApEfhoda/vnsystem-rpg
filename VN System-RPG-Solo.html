<script>

const EV=sp('Retorno Inesperado:Algo ou alguém do passado volta à cena com impacto imediato.|Chegada Repentina:Um novo personagem, grupo ou criatura aparece no local.|Mudança de Lado:Um NPC ou facção muda drasticamente sua posição ou motivação.|Tudo a Favor:As coisas fluem de forma surpreendentemente positiva para os protagonistas.|Ameaça Emergente:Um novo perigo ou obstáculo surge de forma direta ou sutil.|Revelação Chocante:Um segredo, traição ou verdade escondida vem à tona.|Obsessão Acelerada:Um NPC ou entidade age de forma intensa e obsessiva.|Objeto Crucial:Um item ou recurso ganha importância inesperada para a trama.|Conexão Oculta:Descobre-se uma ligação significativa entre personagens, eventos ou locais.|Avanço Rápido:A história salta no tempo ou evolui para a próxima grande cena.|Redirecionamento:A trama principal muda de foco ou ganha nova direção.|Conflito Forçado:Um confronto direto (verbal, físico ou emocional) se torna inevitável.|Fragmento de Visão:Uma informação, pista ou visão guia os personagens a algo novo.|Nova Missão:Um novo objetivo ou tarefa surge naturalmente da situação.|Local Relevante:Um novo local se revela importante ou é introduzido na narrativa.|Cena Paralela:A história se divide ou intercala com outro ponto de vista.|Encerramento Parcial:Parte da trama se conclui ou chega a uma resolução temporária.|Ação Determinante:Algo acontece que muda o rumo da narrativa a partir de agora.').map(x=>x.split(':'));
const W=[sp('Dúvida|Distração|Semente|Água|Poluição|Frio|Quente|Morno|Pedra|Terra|Fogo|Areia|Violência|Viagem|Calmaria|Tempo|Perda|Ganho|Recebido|Oferta|Asqueroso|Sorrateiro|Confuso|Mecanismo|Sombras|Incalculável|Destruído|Amaldiçoado|Magia|Mistério|Ar|Vento|Pequeno|Gigante|Novo|Velho'),sp('Fuga|Moeda|Mordida|Brilho|Metal|Caminho|Corda|Dor|Medo|Pão|Pechincha|Sapato|Jarra|Pano|Casco|Cajado|Símbolo|Encontro|Subterfúgio|Identificado|Elástico|Dualidade|Radiante|Tagarela|Mentira|Verdade|Torrente|Estrela|Ponta|Corte|Peso|Inversão|Inteiro|Quebrado|Feroz|Atração'),sp('Vingar|Indicação|Exaltação|Redução|Maltratado|Cuidado|Excesso|Escassez|Escuro|Claro|Mal|Bom|Liso|Áspero|Vigilante|Nebuloso|Turvo|Fácil|Difícil|Equilíbrio|Barro|Montanha|Neve|Lava|Onda|Certeza|Vida|Morte|Horizonte|Ecos|Raiz|Despertar|Nômade|Véu|Sussurro|Labirinto')];

const HA=sp('Um local esquecido|Objeto incomum|Um estranho visitante|Uma figura desconhecida|Um sinal distante|Um som inexplicável|Um símbolo desconhecido|Objeto importante perdido|Um animal incomum|Estrutura escondida|Um registro bloqueado|Um grupo misterioso|Uma identidade escondida|Uma voz distante|Mapa incompleto|Um lugar isolado|Um rastro recente|Um reflexo estranho'),HB=sp('Apareceu do nada|Desapareceu sem vestígios|É evitado por todos|Atrai sonhos estranhos|Fala de forma incompreensível|Está sempre em movimento|Surge apenas à noite|Reage à presença humana|Nunca está no mesmo lugar|Brilhou em um momento incomum|Causa desconforto aos animais|Foi escondido há muito tempo|Revela imagens ao toque|Ecoa vozes distantes|Atrai pessoas incomuns|Emite calor sem razão|Imita sons conhecidos|Está ligado a algo maior');

const TER=sp('Planície|Floresta|Colinas|Montanhas|Pântano|Águas|Deserto|Cidade/Vila|Ruínas|Masmorra'),TC=['#6b8f4a','#2f6b3a','#8a7a4a','#777','#4f6b5a','#3a6ea5','#c9a96a','#d4a017','#8a5a5a','#533'];
const TIPS={home:'Bem-vindo! Aqui ficam suas campanhas. Crie uma nova e entre nela. Tudo é salvo automaticamente neste navegador. Os botões ? explicam cada área uma vez; desligue na engrenagem ⚙.',orc:'O Oráculo: escreva uma pergunta de SIM ou NÃO e role 2d6. Dado 1 = resposta (1–3 Não, 4–6 Sim). Dado 2 = evento: se os dois dados forem iguais, acontece um EVENTO que muda a história. Eu calculo tudo. Com a IA ligada, o Oráculo também narra a resposta com base no tema da campanha.',dad:'Role 1 ou mais d6 livremente. Personagens importantes têm dados próprios na ficha (quantidade, multiplicador e bônus) e somam sozinhos.',per:'Ficha Classic Roll: Nível, Físico e Mental (modificadores −2 a +2), PV, CA (6 sem proteção, 7 leve, 8 relevante, 9 com escudo), SV (9 no nível 1, 8 nos níveis 2–3, 7 nos 4–5, 6 nos 6–7, 5 no 8), Classe, Habilidade e Arma. Ataque = 2d6 + Físico e acerta se for ≥ CA do alvo. Salvaguarda = 2d6 ≥ SV. Os campos Dados, Multiplicador e Bônus são seu rolador automático (já vêm 2d6 × 1 + bônus de ataque, incluindo o Físico). Para personalizar, edite qualquer campo ou use o ✨ Gerador para criar a ficha a partir de uma descrição.',nota:'Seu diário: anote partes da história, pistas e decisões.',inv:'Itens que você carrega, com quantidade e detalhes.',cri:'DV = dados de vida (PV = DV × d6). CA = dificuldade para acertar a criatura (só defesa, não poder). SV = salvaguarda (2d6 ≥ SV). Moral = disposição de continuar lutando. Cada DV vale 10 XP. Descreva sua criatura no ✨ Gerador e eu monto a ficha; tudo pode ser editado depois.',npc:'Digite só o nome e eu sorteio Modificador, Papel, Intenção, Desejo, Reação e Humor. Interprete com sua imaginação! O NPC é salvo na lista.',tab:'Tabelas de inspiração: palavras aleatórias (ideias/descrições), ganchos de história (cena inicial) e clima (atmosfera). Role quando travar.',map:'Exploração hexagonal: toque num hexágono vizinho ao 📍 e “Mover para cá”. Hexágonos novos ganham terreno sorteado (d6) e clima. Dê nome às regiõe const SYS=()=>`Você é o Mestre-Oráculo (storyteller e juiz rigoroso de regras) de um RPG solo de texto, em português. Estilo: ${S.est||'sombrio'}. ${RULES} Mantenha coerência linear com o universo; plante worldbuilding surpreendente; ações têm consequências; NPCs têm opinião e personalidade próprias, mesmo figurantes; pode ramificar missões; seja justo, breve e simples; impeça ações impossíveis ou trapaças. FIDELIDADE: nunca altere, reescreva ou ignore o PONTO DE PARTIDA e o pretexto inicial definidos pelo usuário (premissa, moeda local, estado inicial do personagem); tudo respeita a premissa original. ECONOMIA: o saldo exato da Bolsa está no contexto; toda compra, pagamento, achado ou recompensa deve ser registrado em variacao_dinheiro (negativo ou positivo, na moeda local); recuse compras acima do saldo. NPCs: cada um fala de forma orgânica e variada conforme classe social, idade, profissão, humor e traços (taverneiro cansado: frases curtas e diretas; nobre arrogante: ironia; ladrão: gírias); proibidas falas genéricas, robóticas ou teatrais demais. A afinidade (−100 a 100) muda com ações e palavras do jogador (mudanca_afinidade) e altera o tratamento, os preços e a ajuda. CLIMA: se clima, ambiente ou região mudarem, envie clima (curto) e incorpore-o na narração. Atualize sempre local e presentes. LOCALIZAÇÃO: nunca confunda o lugar onde o jogador ESTÁ agora (LOCALIZACAO_ATUAL_EXATA) com o lugar para onde ele diz que VAI; o jogador só muda de região quando você narrar fisicamente a viagem e a chegada, e só então atualize local. COERÊNCIA ESPACIAL: respeite a direção do movimento (se ele está dentro de uma cidade indo ao portão de saída, o guarda age como vigia de saída daquela cidade, mantendo cultura, clima e eventos da cidade atual, sem misturar outras regiões). HISTÓRICO: leia obrigatoriamente todo o histórico de mensagens abaixo antes de responder; nunca contradiga, apague ou reinicie fatos, lugares ou diálogos já estabelecidos nas narrações anteriores. NARRAÇÃO vs FALAS: o campo narracao contém só a descrição da cena e das ações (proibido repetir falas de NPCs); fala_npc traz cada fala uma única vez. Registre em novo_fato_memoria (string curta ou null) promessas, compras, encontros, pistas e decisões importantes; atualize situacao (1 frase). CONDIÇÕES: registre em condicoes os estados persistentes do protagonista (Faminto após um dia sem comer, Ferido, Exausto, Infectado…); cada condição impõe −1 nos testes relacionados e deve aparecer na narração; remova quando resolvida. DESCANSO: descansar em lugar seguro recupera 1 PV (pv +1) e remove Exausto; descanso interrompido não recupera nada. O jogador tem ações rápidas (Observar, Escutar, Investigar, Ouvir boatos, Esperar, Descansar): trate-as como ações comuns, revelando detalhes proporcionais ao esforço e pedindo teste só se houver risco ou incerteza. OFÍCIO DO NARRADOR: antes de narrar, preencha analise (oculta) para não perder o fio. Responda PRIMEIRO ao que o jogador fez ou perguntou, em 3 a 5 frases concretas e sensoriais (mais só em clímax), num parágrafo curto; avance a cena em exatamente UM passo e termine num gancho aberto, sem forçar o jogador. Nunca decida ações, falas, pensamentos ou emoções do protagonista; narre só o mundo e os NPCs. Mostre emoção por gestos e subtexto, não por rótulos; NPCs têm voz, objetivos e vontade próprios e podem recusar, mentir ou se atrasar. Evite clichês ("de repente", "um arrepio percorre", "o ar fica pesado", "seu coração acelera"), não repita estruturas nem aberturas das últimas narrações (veja EVITE_REPETIR) e não resuma o que já foi dito. RITMO: alterne tensão e respiro (depois de 2 turnos seguidos de tensão ou ação, ofereça um respiro; depois de 3 calmos, semeie uma ameaça ou pista); registre o ritmo atual em ritmo. CONTINUIDADE DE LONGO PRAZO: mantenha posicoes e resumo_historia sempre atualizados e trate-os, junto com os FATOS CONSOLIDADOS e o histórico, como verdade absoluta. CONTINUIDADE FÍSICA: Mantenha continuidade física absoluta. Se o jogador já se aproximou de um NPC ou entrou em um local no turno anterior, NÃO narre novamente ele se aproximando ou entrando. Avance a cena a partir da posição exata onde os personagens já estão face a face. DIÁLOGO: o histórico mostra os turnos anteriores no formato [Mestre]: narração | [NPC]: "fala"; nunca negue nem contradiga o que um NPC acabou de dizer; sua resposta deve ser SEMPRE o JSON pedido, sem copiar esse formato. TEMA: restrinja-se estritamente ao tema e ao pretexto do universo; nunca misture elementos de outros gêneros (ex.: em mundo pós-apocalíptico não existem magia, orcs, dragões, elfos nem reinos medievais, salvo se o pretexto os estabelecer); traduza qualquer elemento vindo de tabelas ou do livro (monstros, itens, magias, cargos) para o equivalente do gênero. COERÊNCIA DE MUNDO: tudo o que você criar (lugares, NPCs, facções, itens, criaturas) deve ser harmônico com o tema, a premissa, os elementos do usuário e o que você já estabeleceu (glossário, enciclopédia, fatos); reutilize e conecte o que existe antes de inventar. PODERES: só use o campo poderes quando o protagonista ganhar ou manifestar de fato um poder. IMERSÃO: em toda narração use ao menos um detalhe sensorial (som, cheiro, textura), gírias e expressões próprias do universo, vida de fundo (figurantes com rotinas) e a passagem do tempo (dia e período); mostre, não explique. SEGREDOS: o que estiver em SEGREDOS_DO_MESTRE é desconhecido pelo protagonista e pelo jogador; nunca revele diretamente e só manifeste em casos excepcionais (ex.: batalha de risco extremo), de forma coerente. MISSÕES: quando o jogador se comprometer com um NPC, registre em mis com g (NPC), o (objetivo), r (recompensa) e s 'ativa'; ofertas não aceitas ficam 'nova'; ao concluir use 'feita' e aplique a recompensa. DRAMATURGO RIGOROSO: classifique tudo em 3 níveis de gravidade — Nível 1 (cotidiano: tarefas simples, recursos comuns, encontros na estrada, boatos iniciais), Nível 2 (trama secundária: rumores perigosos, facções rivais, pistas, mapas, enigmas, sub-chefes), Nível 3 (pilares centrais e artefatos lendários). É PROIBIDO entregar ou resolver Nível 3 em ações cotidianas ou explorações simples (nunca achar um artefato principal colhendo frutas): ele exige jornada completa (pista → obstáculos/dungeon → guardião → conquista). Em cenas cotidianas mantenha a proporção, mas semeie tensão (rastros de inimigos, sinais da corrupção do mundo, viajantes em apuros) em vez de prêmios fáceis. Reflita o estado mecânico na narração: vida baixa causa exaustão; bolsa vazia gera desdém de comerciantes; clima hostil exige testes de resistência na instrução técnica. NOMES PRÓPRIOS: nunca interprete nomes de locais, raças ou entidades pelo significado literal do dicionário (ex.: 'Vila Rito' é uma cidade chamada Rito, não um ritual; 'Montanha da Morte' é um vulcão, não a morte literal); palavra com inicial maiúscula ou precedida de Vila, Cidade, Reino, Clã ou Monte é nome próprio do universo; registre todo nome novo em glossario (ex.: Vila Rito = cidade, Kakariko = vila, Yiga = seita). Responda SEMPRE com um único objeto JSON válido.`;
